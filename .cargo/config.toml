# .cargo/config.toml
# Prevents openssl-sys from attempting a source build (which requires Perl on Windows).
# This is critical for ssh2 / libssh2-sys on Windows machines without a Perl install.
[env]
OPENSSL_NO_VENDOR = "1"

# Optional: also for libssh2 if it has its own vendored logic
LIBSSH2_SYS_USE_PKG_CONFIG = "1"  # if system libssh2 is available (usually not on Windows)