[package]
name = "helix_io"
version = "0.1.0"
edition = "2021"
authors = ["John McConnell <john.microtech@gmail.com>"]
description = "IO Module for Helix - Handles external communications (web, terminal, Ollama, Gemini, etc.)"

[lib]
name = "helix_io"
path = "io.rs"

[dependencies]
# Placeholder for future dependencies
# tokio = { version = "1.0", features = ["full"] }  # For async operations
# serde = { version = "1.0", features = ["derive"] }  # For serialization/deserialization
# reqwest = { version = "0.11", features = ["json"] }  # For HTTP requests

[dev-dependencies]
# Dependencies for testing
# tokio-test = "0.4"  # For async testing

[workspace]
members = [
    "ollama",
    "web_server",
    "terminal",
    "llm_gemini",
]
