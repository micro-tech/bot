        <style>
            :root {
                --bg: #0d1117;
                --panel: #161b22;
                --panel-alt: #0d1117;
                --border: #30363d;
                --text: #e6edf3;
                --muted: #8b949e;
                --accent: #00d4ff;
                --danger: #ff6b6b;
                --warn: #e3b341;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
                overflow: hidden;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
                    Arial, sans-serif;
                font-size: 14px;
            }
            #app {
                display: grid;
                grid-template-columns: 280px minmax(0, 1fr) 340px;
                height: 100vh;
                width: 100vw;
            }

            /* ── Left sidebar ─────────────────────────────── */
            #sidebar {
                background: var(--panel-alt);
                border-right: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            #brand {
                padding: 16px;
                border-bottom: 1px solid var(--border);
            }
            #brand h1 {
                margin: 0;
                font-size: 1.3em;
                color: var(--text);
            }
            #brand .version {
                font-size: 0.75em;
                color: var(--muted);
            }
            #brand {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            #brand-mark {
                width: 38px;
                height: 38px;
                border-radius: 8px;
                flex: none;
            }
            #brand-text h1 {
                margin: 0;
                font-size: 1.3em;
                color: var(--text);
            }
            #brand-text .version {
                font-size: 0.75em;
                color: var(--muted);
            }
            #backend-list {
                flex: 1;
                overflow-y: auto;
                padding: 8px;
            }
            .llm-btn {
                display: block;
                width: 100%;
                text-align: left;
                margin: 0 0 6px 0;
                padding: 10px 12px;
                background: var(--panel);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 6px;
                cursor: pointer;
            }
            .llm-btn .kind {
                display: block;
                font-size: 0.75em;
                color: var(--muted);
            }
            .llm-btn.selected {
                border-color: var(--accent);
                color: var(--accent);
            }
            .llm-btn .row-main {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--muted);
                flex-shrink: 0;
            }

            /* ── Center chat panel ────────────────────────── */
            #chat-panel {
                display: flex;
                flex-direction: column;
                background: var(--bg);
                min-width: 0;
            }
            #chat-header {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 12px 16px;
                border-bottom: 1px solid var(--border);
                background: var(--panel-alt);
            }
            #chat-title {
                font-weight: 600;
                font-size: 1.05em;
            }
            #chat-backend-label {
                color: var(--muted);
                font-size: 0.9em;
            }
            #conn-dot {
                margin-left: auto;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--muted);
                flex-shrink: 0;
            }
            #chat-messages {
                flex: 1;
                overflow-y: auto;
                padding: 16px;
            }
            .message {
                margin-bottom: 10px;
                max-width: 78%;
                padding: 10px 14px;
                border-radius: 12px;
                overflow-wrap: break-word;
            }
            .agent-bubble {
                margin-right: auto;
                background: var(--panel);
                border: 1px solid var(--border);
                border-top-left-radius: 4px;
            }
            .user-bubble {
                margin-left: auto;
                background: #0f3460;
                border: 1px solid #0f3460;
                border-top-right-radius: 4px;
            }
            .new-divider {
                text-align: center;
                color: var(--accent);
                font-size: 0.75em;
                letter-spacing: 0.1em;
                margin: 14px 0;
            }
            #conn-dot.green {
                background: #3fb950;
            }
            #conn-dot.red {
                background: var(--danger);
            }
            .sender {
                font-weight: bold;
                color: var(--accent);
            }
            #chat-input-row {
                display: flex;
                gap: 8px;
                padding: 12px 16px;
                border-top: 1px solid var(--border);
                background: var(--panel-alt);
                flex-shrink: 0;
            }
            #chat-input {
                flex: 1;
                padding: 10px 12px;
                background: var(--panel);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 6px;
            }
            #chat-send {
                padding: 10px 20px;
                background: #0f3460;
                color: var(--accent);
                border: 1px solid var(--accent);
                border-radius: 6px;
                cursor: pointer;
            }

            /* ── Right detail panel ───────────────────────── */
            #detail-panel {
                background: var(--panel-alt);
                border-left: 1px solid var(--border);
                overflow-y: auto;
                padding: 16px;
            }
            #detail-panel h2 {
                font-size: 1em;
                margin: 0 0 10px 0;
                color: var(--text);
            }
            #detail-panel section {
                margin-bottom: 28px;
            }
            /* Detail tabs */
            #detail-tabs {
                display: flex;
                gap: 4px;
                margin-bottom: 16px;
                border-bottom: 1px solid var(--border);
                padding-bottom: 8px;
            }
            .detail-tab {
                background: none;
                border: none;
                color: var(--muted);
                padding: 6px 10px;
                cursor: pointer;
                font-size: 0.9em;
                margin: 0;
            }
            .detail-tab.active {
                color: var(--text);
                border-bottom: 2px solid var(--accent);
                padding-bottom: 4px;
            }
            .detail-tab-content {
                display: none;
            }
            .detail-tab-content.active {
                display: block;
            }
            #raw-config-wrap {
                margin-top: 16px;
            }
            #raw-config-wrap summary {
                cursor: pointer;
                color: var(--accent);
                font-size: 0.9em;
                margin-bottom: 8px;
            }
            #config-summary pre {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 10px;
                font-size: 11px;
                max-height: 300px;
                overflow-y: auto;
                white-space: pre-wrap;
            }
            .summary-row {
                display: flex;
                justify-content: space-between;
                padding: 6px 0;
                border-bottom: 1px solid var(--border);
                font-size: 0.9em;
            }
            .summary-row .k {
                color: var(--muted);
            }
            #library-content ul {
                list-style: none;
                padding: 0;
                margin: 8px 0;
            }
            #library-content li {
                padding: 4px 0;
                border-bottom: 1px solid var(--border);
                font-size: 0.9em;
            }
            #library-content h3 {
                font-size: 0.9em;
                color: var(--muted);
                margin: 14px 0 4px 0;
            }
            #config-textarea {
                width: 100%;
                min-height: 220px;
                background: var(--panel);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 8px;
                font-family: ui-monospace, monospace;
                font-size: 12px;
                resize: vertical;
            }
            #config-status {
                margin-top: 8px;
                font-size: 0.85em;
                color: var(--muted);
            }
            #detail-panel button {
                margin: 4px 4px 4px 0;
                padding: 8px 14px;
                background: var(--panel);
                color: var(--accent);
                border: 1px solid var(--border);
                border-radius: 6px;
                cursor: pointer;
            }
            #detail-panel button:hover {
                border-color: var(--accent);
            }
            #log-output {
                white-space: pre-wrap;
                background: var(--panel);
                padding: 12px;
                border: 1px solid var(--border);
                border-radius: 6px;
                font-size: 12px;
                max-height: 400px;
                overflow-y: auto;
            }
            .error-msg {
                color: var(--danger);
            }
            /* Routines */
            #routines-section h2 {
                font-size: 1em;
                margin: 0 0 6px 0;
            }
            .routine-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                padding: 10px 0;
                border-bottom: 1px solid var(--border);
            }
            .routine-name {
                font-weight: 600;
                font-size: 0.9em;
            }
            .routine-schedule {
                color: var(--muted);
                font-size: 0.8em;
            }
            .toggle {
                position: relative;
                width: 40px;
                height: 22px;
                border-radius: 11px;
                background: var(--panel);
                border: 1px solid var(--border);
                cursor: pointer;
                padding: 0;
                margin: 0;
                flex-shrink: 0;
            }
            .toggle .knob {
                position: absolute;
                top: 2px;
                left: 2px;
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: var(--muted);
            }
            .toggle.on {
                background: #0f3460;
                border-color: var(--accent);
            }
            .toggle.on .knob {
                left: 20px;
                background: var(--accent);
            }
            .toggle:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            /* ── Responsive: drawers below desktop widths ── */
            #drawer-sidebar-btn,
            #drawer-detail-btn {
                display: none;
                padding: 6px 10px;
                background: var(--panel);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.85em;
            }
            @media (max-width: 1100px) {
                #app {
                    grid-template-columns: 280px minmax(0, 1fr);
                }
                #detail-panel {
                    position: fixed;
                    top: 0;
                    right: 0;
                    bottom: 0;
                    width: min(340px, 92vw);
                    z-index: 50;
                    transform: translateX(105%);
                    transition: transform 0.18s ease-out;
                    box-shadow: -8px 0 24px rgba(0, 0, 0, 0.5);
                }
                #detail-panel.drawer-open {
                    transform: none;
                }
                #drawer-detail-btn {
                    display: inline-block;
                }
            }
            @media (max-width: 800px) {
                #app {
                    grid-template-columns: minmax(0, 1fr);
                }
                #sidebar {
                    position: fixed;
                    top: 0;
                    left: 0;
                    bottom: 0;
                    width: min(280px, 92vw);
                    z-index: 50;
                    transform: translateX(-105%);
                    transition: transform 0.18s ease-out;
                    box-shadow: 8px 0 24px rgba(0, 0, 0, 0.5);
                }
                #sidebar.drawer-open {
                    transform: none;
                }
                #drawer-sidebar-btn {
                    display: inline-block;
                }
            }
        </style>
    </head>
    <body>
        <div id="app">
            <!-- LEFT SIDEBAR -->

                    <div id="brand-text">
                        <h1>Helix</h1>
                        <span class="version">v2026-06-10-v2.3.0</span>
                    </div>
                </div>
                <div id="backend-list">
                    <div style="color: var(--muted); padding: 8px">
                        Connecting…
                    </div>
                </div>
            </aside>

            <!-- CENTER CHAT -->
            <main id="chat-panel">
                <header id="chat-header">
                    <button
                        id="drawer-sidebar-btn"
                        onclick="toggleSidebarDrawer()"
                        title="Backends"
                    >
                        ☰
                    </button>
                    <span id="chat-title">Chat</span>
                    <span id="chat-backend-label"></span>
                    <button
                        id="drawer-detail-btn"
                        onclick="toggleDetailDrawer()"
                        title="Details"
                    >
                        Details
                    </button>
                    <span id="conn-dot" title="connection status"></span>
                </header>
                <div id="chat-messages"></div>
                <div id="chat-input-row">
                    <input
                        type="text"
                        id="chat-input"
                        placeholder="Message Helix..."
                        onkeypress="if (event.key === 'Enter') sendChat();"
                    />
                    <button id="chat-send" onclick="sendChat()">Send</button>
                </div>
            </main>

            <!-- RIGHT DETAIL PANEL -->
            <aside id="detail-panel">
                <div id="detail-tabs">
                    <button
                        class="detail-tab active"
                        data-tab="details"
                        onclick="showDetailTab('details')"
                    >
                        Details
                    </button>
                    <button
                        class="detail-tab"
                        data-tab="library"
                        onclick="showDetailTab('library')"
                    >
                        Library
                    </button>
                    <button
                        class="detail-tab"
                        data-tab="computer"
                        onclick="showDetailTab('computer')"
                    >
                        Computer
                    </button>
                    <button
                        class="detail-tab"
                        data-tab="logs"
                        onclick="showDetailTab('logs')"
                    >
                        Logs
                    </button>
                </div>

                <section
                    id="tab-details"
                    class="detail-tab-content active"
                >
                    <h2>Details</h2>
                    <div id="config-summary">
                        <div style="color: var(--muted)">
                            Waiting for config…
                        </div>
                    </div>
                    <details id="raw-config-wrap">
                        <summary>Edit raw config</summary>
                        <textarea id="config-textarea"></textarea>
                        <button onclick="saveConfig()">Save Config</button>
                        <div id="config-status"></div>
                    </details>
                </section>

                <section id="tab-library" class="detail-tab-content">
                    <h2>Library</h2>
                    <div id="library-content">
                        <div style="color: var(--muted)">Loading…</div>
                    </div>
                </section>

                <section id="tab-computer" class="detail-tab-content">
                    <h2>Computer</h2>
                    <div id="computer-backends">
                        <div style="color: var(--muted)">
                            Waiting for backends…
                        </div>
                    </div>
                    <div
                        id="computer-tools-note"
                        style="
                            margin-top: 12px;
                            font-size: 0.85em;
                            color: var(--muted);
                        "
                    ></div>
                </section>

                <section id="tab-logs" class="detail-tab-content">
                    <h2>Logs</h2>
                    <button onclick="loadLog('/logs/chat')">Chat Log</button>
                    <button onclick="clearLog('/logs/chat/clear', 'chat')">
                        Clear Chat Log
                    </button>
                    <button onclick="loadLog('/logs/error')">Error Log</button>
                    <button onclick="clearLog('/logs/error/clear', 'error')">
                        Clear Error Log
                    </button>
                    <pre id="log-output"></pre>
                </section>

                <section id="routines-section">
                    <h2>Routines</h2>
                    <div id="routines-list"></div>
                </section>
            </aside>
        </div>

        <script>
            let ws;
            let selectedLlm = "";
            // id -> label for the chat header (from the real `backends` message)
            let backendLabels = {};
            // Full backend list cache, for the Computer tab.
            let backendListCache = [];
            // NEW divider: inserted once, above the first message appended
            // after page load. Simple, honest semantics.
            let newDividerShown = false;

            // Responsive drawers (task 198): below ~1100px the detail
            // panel and below ~800px the sidebar become toggleable
            // overlays instead of grid columns. Content is never lost —
            // the header buttons always bring the panels back.
            function toggleDetailDrawer() {
                const p = document.getElementById("detail-panel");
                if (p) p.classList.toggle("drawer-open");
            }
            function toggleSidebarDrawer() {
                const s = document.getElementById("sidebar");
                if (s) s.classList.toggle("drawer-open");
            }

            function showDetailTab(name) {
                document
                    .querySelectorAll(".detail-tab-content")
                    .forEach((el) => el.classList.remove("active"));
                document
                    .querySelectorAll(".detail-tab")
                    .forEach((el) =>
                        el.classList.toggle("active", el.dataset.tab === name),
                    );
                const tab = document.getElementById("tab-" + name);
                if (tab) tab.classList.add("active");
                if (name === "library") loadLibrary();
            }

            // DETAILS tab: read-only summary derived from the `config` WS
            // message. The config arrives REDACTED until auth — values are
            // displayed exactly as received; nothing is unredacted or
            // reconstructed client-side, ever.
            function renderConfigSummary(tomlText) {
                const box = document.getElementById("config-summary");
                if (!box) return;
                box.innerHTML = "";
                const text = String(tomlText == null ? "" : tomlText);
                if (!text.trim()) {
                    box.innerHTML =
                        '<div style="color: var(--muted)">No config received yet.</div>';
                    return;
                }
                // Section headers like [web], [[ollama]], with key counts.
                const lines = text.split("\n");
                const sections = [];
                let current = null;
                const headerRe = /^\s*\[+\s*([^\]]+?)\s*\]+/;
                const keyRe = /^\s*[A-Za-z0-9_.-]+\s*=/;
                for (const line of lines) {
                    const h = line.match(headerRe);
                    if (h) {
                        current = { name: h[1].trim(), keys: 0 };
                        sections.push(current);
                    } else if (current && keyRe.test(line)) {
                        current.keys++;
                    }
                }
                const frag = document.createDocumentFragment
                    ? document.createDocumentFragment()
                    : null;
                const addRow = (k, v) => {
                    const row = document.createElement("div");
                    row.className = "summary-row";
                    const ks = document.createElement("span");
                    ks.className = "k";
                    ks.textContent = k;
                    const vs = document.createElement("span");
                    vs.textContent = v;
                    row.appendChild(ks);
                    row.appendChild(vs);
                    (frag || box).appendChild(row);
                };
                addRow("sections", String(sections.length));
                sections.slice(0, 12).forEach((s) => {
                    addRow("[" + s.name + "]", s.keys + " keys");
                });
                if (frag) box.appendChild(frag);
                const pre = document.createElement("pre");
                pre.textContent = text;
                box.appendChild(pre);
            }

            // LIBRARY tab: real GET /okf/registry endpoint.
            let libraryLoaded = false;
            function loadLibrary() {
                const box = document.getElementById("library-content");
                if (!box || libraryLoaded) return;
                const empty = (t) => {
                    box.innerHTML = "";
                    const d = document.createElement("div");
                    d.style.color = "var(--muted)";
                    d.textContent = t;
                    box.appendChild(d);
                };
                fetch("/okf/registry")
                    .then((r) => r.json())
                    .then((data) => {
                        if (
                            !data ||
                            data.status === "disabled" ||
                            data.bundle_id == null
                        ) {
                            empty(
                                "OKF Library is disabled or unavailable. Set [helix.okf] enabled = true to use it.",
                            );
                            return;
                        }
                        libraryLoaded = true;
                        box.innerHTML = "";
                        const head = document.createElement("div");
                        const bname = document.createElement("div");
                        bname.style.fontWeight = "600";
                        bname.textContent =
                            "Bundle " + data.bundle_id + " v" + data.version;
                        const counts = document.createElement("div");
                        counts.style.color = "var(--muted)";
                        counts.style.fontSize = "0.85em";
                        counts.textContent =
                            data.tool_count +
                            " tools · " +
                            data.knowledge_count +
                            " knowledge entries";
                        head.appendChild(bname);
                        head.appendChild(counts);
                        box.appendChild(head);
                        const listSection = (title, items, nameOf) => {
                            if (!items || !items.length) return;
                            const h = document.createElement("h3");
                            h.textContent = title;
                            const ul = document.createElement("ul");
                            items.forEach((it) => {
                                const li = document.createElement("li");
                                li.textContent =
                                    nameOf(it) ||
                                    JSON.stringify(it).slice(0, 80);
                                ul.appendChild(li);
                            });
                            box.appendChild(h);
                            box.appendChild(ul);
                        };
                        const toolName = (t) =>
                            typeof t === "string"
                                ? t
                                : t.name || t.id || "";
                        const knowName = (k) =>
                            typeof k === "string"
                                ? k
                                : k.id || k.title || k.name || "";
                        listSection("Tools", data.tools, toolName);
                        listSection("Knowledge", data.knowledge, knowName);
                    })
                    .catch(() => {
                        empty(
                            "Could not reach the library endpoint (/okf/registry).",
                        );
                    });
            }

            // COMPUTER tab: backends from the real `backends` WS message.
            // NOTE (flagged for Ranger 1): no WS message or endpoint exposes
            // Helix's full tool list today — tools are only reachable via
            // chat text commands like /tools. Needed: a `tools_list` WS
            // message or GET /tools endpoint returning [{name, description}].
            // This tab ships with backends data and the documented gap.
            function renderComputerTab() {
                const box = document.getElementById("computer-backends");
                if (!box) return;
                box.innerHTML = "";
                if (!backendListCache.length) {
                    box.innerHTML =
                        '<div style="color: var(--muted)">No backends connected.</div>';
                } else {
                    backendListCache.forEach((b) => {
                        const row = document.createElement("div");
                        row.className = "summary-row";
                        const ks = document.createElement("span");
                        ks.textContent = b.label;
                        const vs = document.createElement("span");
                        vs.className = "k";
                        vs.textContent = b.kind || "";
                        row.appendChild(ks);
                        row.appendChild(vs);
                        box.appendChild(row);
                    });
                }
                const note = document.getElementById("computer-tools-note");
                if (note && !note.textContent) {
                    note.textContent =
                        "Full tool list is not exposed by the backend yet — use /tools in chat.";
                }
            }

            function setConnDot(state) {
                const dot = document.getElementById("conn-dot");
                if (!dot) return;
                dot.classList.remove("green", "red");
                if (state === "open") {
                    dot.classList.add("green");
                    dot.title = "connected";
                } else if (state === "closed") {
                    dot.classList.add("red");
                    dot.title = "disconnected — reconnecting…";
                } else {
                    dot.title = "connection status";
                }
            }

            // Log functions defined first so they're always available
            function loadLog(url) {
                fetch(url)
                    .then((r) => r.text())
                    .then((t) => {
                        const out = document.getElementById("log-output");
                        if (out) out.textContent = t;
                    });
            }

            function clearLog(url, type) {
                fetch(url, { method: "POST" })
                    .then((r) => r.text())
                    .then((t) => {
                        const out = document.getElementById("log-output");
                        if (out) out.textContent = t;
                    });
            }

            function connectWS() {
                const protocol =
                    location.protocol === "https:" ? "wss:" : "ws:";
                ws = new WebSocket(
                    protocol + "//" + location.hostname + ":8443/ws",
                );
                ws.onopen = () => {
                    console.log("WS connected");
                    setConnDot("open");
                };
                ws.onmessage = handleMessage;
                ws.onclose = () => {
                    setConnDot("closed");
                    setTimeout(connectWS, 3000);
                };
            }

            function handleMessage(event) {
                const msg = JSON.parse(event.data);
                console.log("[WS] Received:", msg);

                if (msg.type === "config") {
                    const ta = document.getElementById("config-textarea");
                    if (ta) ta.value = msg.data;
                    renderConfigSummary(msg.data);
                } else if (msg.type === "manifest") {
                    // ignore manifest on the UI for now
                } else if (msg.type === "backends") {
                    buildLlmButtons(msg.backends);
                } else if (msg.type === "routines") {
                    renderRoutines(
                        Array.isArray(msg.routines) ? msg.routines : [],
                    );
                } else if (msg.type === "routine_status") {
                    handleRoutineStatus(msg);
                } else if (
                    msg.type === "user_msg" ||
                    msg.type === "ollama_response" ||
                    msg.type === "llm_output" ||
                    msg.type === "error" ||
                    msg.type === "warning"
                ) {
                    appendChat(msg);
                }
            }

            function buildLlmButtons(backends) {
                const container = document.getElementById("backend-list");
                if (!container) return;
                container.innerHTML = "";
                backendLabels = {};
                backendListCache = Array.isArray(backends) ? backends : [];
                renderComputerTab();
                if (!backends || backends.length === 0) {
                    // Honest empty state — never a blank panel.
                    const empty = document.createElement("div");
                    empty.style.cssText =
                        "color: var(--muted); padding: 8px;";
                    empty.textContent = "No backends connected";
                    container.appendChild(empty);
                    const hdr = document.getElementById("chat-backend-label");
                    if (hdr) hdr.textContent = "";
                    return;
                }
                backends.forEach((b, i) => {
                    backendLabels[b.id] = b.label;
                    const btn = document.createElement("button");
                    btn.className = "llm-btn";
                    btn.dataset.id = b.id;
                    // Status dot: the `backends` message carries no health
                    // data, so this stays neutral ("unknown") rather than
                    // implying a live status we don't have.
                    const dot = document.createElement("span");
                    dot.className = "status-dot";
                    dot.title = "status unknown";
                    const label = document.createElement("span");
                    label.textContent = b.label;
                    const rowMain = document.createElement("span");
                    rowMain.className = "row-main";
                    rowMain.appendChild(dot);
                    rowMain.appendChild(label);
                    const kind = document.createElement("span");
                    kind.className = "kind";
                    kind.textContent = b.kind || "";
                    btn.appendChild(rowMain);
                    btn.appendChild(kind);
                    btn.onclick = () => selectLlm(b.id);
                    container.appendChild(btn);
                    // Auto-select the first backend
                    if (i === 0) selectLlm(b.id);
                });
            }

            function selectLlm(id) {
                selectedLlm = id;
                document.querySelectorAll(".llm-btn").forEach((el) => {
                    el.classList.toggle("selected", el.dataset.id === id);
                });
                const hdr = document.getElementById("chat-backend-label");
                if (hdr) hdr.textContent = backendLabels[id] || "";
            }

            function sendChat() {
                const input = document.getElementById("chat-input");
                if (!input || !input.value.trim() || !ws) return;
                ws.send(
                    JSON.stringify({
                        type: "chat",
                        msg: input.value,
                        llm: selectedLlm,
                    }),
                );
                input.value = "";
            }

            function appendChat(msg) {
                console.log("[Chat] Appending message:", msg);
                const div = document.getElementById("chat-messages");
                if (!div) return;

                // Determine sender label
                let sender;
                let isError = false;
                if (msg.type === "user_msg") {
                    sender = msg.from || "You";
                } else if (msg.type === "error") {
                    sender = "❌ Error";
                    isError = true;
                } else if (msg.type === "warning") {
                    sender = "⚠️ Warning";
                } else {
                    // Use the actual from (e.g. "server", "desktop", "gemini") when available
                    sender = msg.from || "Helix";
                }

                // === VERY ROBUST TEXT EXTRACTION ===
                // This prevents "[object Object]" no matter what shape the server sends.
                function extractText(v) {
                    if (v == null) return "";
                    if (typeof v === "string") return v;
                    if (typeof v === "number" || typeof v === "boolean") return String(v);
                    if (Array.isArray(v)) {
                        return v.map(extractText).filter(Boolean).join(" ");
                    }
                    if (typeof v === "object") {
                        // Try the most common places first
                        const keys = ["msg", "data", "text", "content", "response", "answer", "result", "output"];
                        for (const k of keys) {
                            if (v[k] != null) {
                                const t = extractText(v[k]);
                                if (t) return t;
                            }
                        }
                        // Try any string property that looks like a sentence
                        for (const k in v) {
                            const t = extractText(v[k]);
                            if (t && t.length > 3) return t;
                        }
                        return JSON.stringify(v);
                    }
                    return String(v);
                }

                let text = extractText(msg.data ?? msg.msg ?? msg.text ?? msg);

                if (!text || text.trim() === "") return;

                // If what we got is a JSON string, try to unwrap it one level
                if (typeof text === "string" && text.trim().startsWith("{")) {
                    try {
                        const parsed = JSON.parse(text);
                        const unwrapped = extractText(parsed);
                        if (unwrapped && unwrapped !== text) text = unwrapped;
                    } catch (e) {}
                }

                // Absolute final guard — NEVER let an object reach the DOM as [object Object]
                if (typeof text !== "string") {
                    try { text = JSON.stringify(text); } catch(e) { text = String(text); }
                }
                if (!text || text === "[object Object]" || text === "{}" || text.trim() === "") {
                    text = "(no readable text received from server)";
                }

                const isUser = msg.type === "user_msg";
                const p = document.createElement("div");
                p.className =
                    "message " +
                    (isUser ? "user-bubble" : "agent-bubble") +
                    (isError ? " error-msg" : "");
                // NEW divider above the first message appended after load.
                if (!newDividerShown) {
                    newDividerShown = true;
                    const divider = document.createElement("div");
                    divider.className = "new-divider";
                    divider.textContent = "— NEW —";
                    div.appendChild(divider);
                }
                // Use textContent on a span to guarantee we never get [object Object]
                const senderSpan = document.createElement("span");
                senderSpan.className = "sender";
                senderSpan.textContent = sender + ": ";
                const textSpan = document.createElement("span");
                textSpan.textContent = text;
                p.appendChild(senderSpan);
                p.appendChild(textSpan);
                if (isError) {
                    p.style.color = "#ff6b6b";
                    p.style.fontWeight = "500";
                }
                div.appendChild(p);
                div.scrollTop = div.scrollHeight;
            }

            function saveConfig() {
                const val = document.getElementById("config-textarea").value;
                if (ws)
                    ws.send(JSON.stringify({ type: "config_save", data: val }));
            }

            // ROUTINES section — built against the documented contract:
            //   backend -> {type:"routines", routines:[{id,name,schedule,enabled}]}
            //   UI      -> {type:"routine_toggle", id, enabled}  (user clicks on live rows only)
            //   backend -> {type:"routine_status", id, enabled, ok}
            // The backend exposes NO routines API today, so this renders an
            // honest empty state and sends NOTHING until a real `routines`
            // message arrives. No invented message types in shipped code.
            let routinesLive = false;
            function renderRoutinesEmpty() {
                const list = document.getElementById("routines-list");
                if (!list) return;
                list.innerHTML = "";
                routinesLive = false;
                const d = document.createElement("div");
                d.style.color = "var(--muted)";
                d.style.fontSize = "0.9em";
                d.textContent = "No routines exposed by the backend yet.";
                list.appendChild(d);
            }
            function renderRoutines(routines) {
                const list = document.getElementById("routines-list");
                if (!list) return;
                list.innerHTML = "";
                routinesLive = true;
                routines.forEach((r) => {
                    const row = document.createElement("div");
                    row.className = "routine-row";
                    row.dataset.id = r.id;
                    const info = document.createElement("div");
                    const nm = document.createElement("div");
                    nm.className = "routine-name";
                    nm.textContent = r.name || r.id;
                    const sc = document.createElement("div");
                    sc.className = "routine-schedule";
                    sc.textContent = r.schedule || "";
                    info.appendChild(nm);
                    info.appendChild(sc);
                    const tgl = document.createElement("button");
                    tgl.className = "toggle" + (r.enabled ? " on" : "");
                    tgl.setAttribute("role", "switch");
                    tgl.setAttribute(
                        "aria-checked",
                        r.enabled ? "true" : "false",
                    );
                    tgl.setAttribute("aria-label", "Toggle " + (r.name || r.id));
                    const knob = document.createElement("span");
                    knob.className = "knob";
                    tgl.appendChild(knob);
                    tgl.onclick = () => {
                        const next = !tgl.classList.contains("on");
                        if (ws)
                            ws.send(
                                JSON.stringify({
                                    type: "routine_toggle",
                                    id: r.id,
                                    enabled: next,
                                }),
                            );
                    };
                    row.appendChild(info);
                    row.appendChild(tgl);
                    list.appendChild(row);
                });
            }
            function handleRoutineStatus(msg) {
                // {type:"routine_status", id, enabled, ok}
                const list = document.getElementById("routines-list");
                if (!list || !routinesLive) return;
                const rows = list.children;
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row.dataset || row.dataset.id !== msg.id) continue;
                    if (msg.ok === false) return; // backend refused: leave as-is
                    for (let j = 0; j < row.children.length; j++) {
                        const tgl = row.children[j];
                        if (
                            tgl.className &&
                            tgl.className.split(" ").includes("toggle")
                        ) {
                            tgl.classList.toggle("on", !!msg.enabled);
                            tgl.setAttribute(
                                "aria-checked",
                                msg.enabled ? "true" : "false",
                            );
                        }
                    }
                    return;
                }
            }

            window.onload = () => {
                connectWS();
                renderRoutinesEmpty();
            };
        </script>
    </body>
</html>
