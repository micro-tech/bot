<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Helix Control Panel</title>
        <!-- Version: 2026-06-10-v2.3.0 -->
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                background: #1a1a2e;
                color: #e0e0e0;
            }
            h1 {
                color: #00d4ff;
            }
            #tabs {
                display: flex;
                gap: 5px;
                margin-bottom: 15px;
            }
            .tab-button {
                padding: 10px 20px;
                background: #16213e;
                color: #e0e0e0;
                border: 1px solid #0f3460;
                cursor: pointer;
            }
            .tab-button.active {
                background: #0f3460;
                color: #00d4ff;
                border-color: #00d4ff;
            }
            .llm-btn {
                margin-right: 6px;
                background: #16213e;
                color: #e0e0e0;
                border: 1px solid #0f3460;
            }
            .llm-btn.selected {
                border: 2px solid #00d4ff;
                color: #00d4ff;
                background: #0f3460;
            }
            .tab-content {
                display: none;
                background: #16213e;
                padding: 20px;
                border: 1px solid #0f3460;
            }
            .tab-content.active {
                display: block;
            }
            #chat-input {
                width: 70%;
                padding: 10px;
                background: #0d1b2a;
                color: #e0e0e0;
                border: 1px solid #0f3460;
            }
            #chat-send {
                padding: 10px 20px;
                background: #00897b;
                color: white;
                border: none;
                cursor: pointer;
            }
            #chat-messages {
                height: 400px;
                overflow-y: auto;
                border: 1px solid #0f3460;
                padding: 12px;
                margin-top: 10px;
                background: #0d1b2a;
            }
            .message {
                margin-bottom: 10px;
            }
            .sender {
                font-weight: bold;
                color: #00d4ff;
            }
            textarea {
                width: 100%;
                background: #0d1b2a;
                color: #e0e0e0;
                border: 1px solid #0f3460;
                padding: 8px;
            }
            button {
                margin-top: 8px;
                padding: 8px 16px;
                background: #0f3460;
                color: #00d4ff;
                border: 1px solid #00d4ff;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <h1>
            Helix Control Panel
            <span style="font-size: 0.5em; color: #666"
                >v2026-06-10-v2.3.0</span
            >
        </h1>
        <p style="margin: -10px 0 15px 0; color:#00d4ff; font-size: 0.9em;">
            Helix AI Agent — Full control over reasoning, tools &amp; memory
        </p>
        <div style="font-size:0.75em; color:#666; margin-bottom:10px;">
            Connected to Helix Core • Reasoning • Tools • Memory
        </div>

        <div id="tabs">
            <button class="tab-button active" onclick="showTab('chat')">
                Chat
            </button>
            <button class="tab-button" onclick="showTab('config')">
                Config
            </button>
            <button class="tab-button" onclick="showTab('logs')">Logs</button>
        </div>

        <!-- CHAT TAB -->
        <div id="chat-tab" class="tab-content active">
            <div id="llm-selector" style="margin-bottom: 12px">
                <span style="color:#00d4ff; font-weight:bold;">Helix LLM:</span>
                <span id="llm-buttons"></span>
            </div>
            <input
                type="text"
                id="chat-input"
                placeholder="Message Helix..."
                onkeypress="if (event.key === 'Enter') sendChat();"
            />
            <button id="chat-send" onclick="sendChat()">Send</button>
            <div style="margin: 8px 0 4px; font-size: 0.85em; color: #00d4ff;">Helix Response:</div>
            <div id="chat-messages"></div>
        </div>

        <!-- CONFIG TAB -->
        <div id="config-tab" class="tab-content">
            <h2>Config</h2>
            <textarea id="config-textarea" rows="20"></textarea>
            <button onclick="saveConfig()">Save Config</button>
            <div id="config-status"></div>
        </div>

        <!-- LOGS TAB -->
        <div id="logs-tab" class="tab-content">
            <h2>Logs</h2>
            <button onclick="loadLog('/logs/chat')">Chat Log</button>
            <button onclick="clearLog('/logs/chat/clear', 'chat')">
                Clear Chat Log
            </button>
            <button onclick="loadLog('/logs/error')">Error Log</button>
            <button onclick="clearLog('/logs/error/clear', 'error')">
                Clear Error Log
            </button>
            <pre
                id="log-output"
                style="
                    white-space: pre-wrap;
                    background: #0d1b2a;
                    padding: 12px;
                    border: 1px solid #0f3460;
                "
            ></pre>
        </div>

        <script>
            let ws;
            let selectedLlm = "";

            // Log functions defined first so they're always available
            function loadLog(url) {
                fetch(url)
                    .then((r) => r.text())
                    .then((t) => {
                        const out = document.getElementById("log-output");
                        if (out) out.textContent = t;
                    });
            }

            function clearLog(url, type) {
                fetch(url, { method: "POST" })
                    .then((r) => r.text())
                    .then((t) => {
                        const out = document.getElementById("log-output");
                        if (out) out.textContent = t;
                    });
            }

            function showTab(name) {
                document
                    .querySelectorAll(".tab-content")
                    .forEach((el) => el.classList.remove("active"));
                document
                    .querySelectorAll(".tab-button")
                    .forEach((el) => el.classList.remove("active"));
                const tab = document.getElementById(name + "-tab");
                if (tab) tab.classList.add("active");

                document.querySelectorAll(".tab-button").forEach((btn) => {
                    if (
                        btn.getAttribute("onclick") &&
                        btn.getAttribute("onclick").includes("'" + name + "'")
                    ) {
                        btn.classList.add("active");
                    }
                });
            }

            function connectWS() {
                const protocol =
                    location.protocol === "https:" ? "wss:" : "ws:";
                ws = new WebSocket(
                    protocol + "//" + location.hostname + ":8443/ws",
                );
                ws.onopen = () => console.log("WS connected");
                ws.onmessage = handleMessage;
                ws.onclose = () => setTimeout(connectWS, 3000);
            }

            function handleMessage(event) {
                const msg = JSON.parse(event.data);
                console.log("[WS] Received:", msg);

                if (msg.type === "config") {
                    const ta = document.getElementById("config-textarea");
                    if (ta) ta.value = msg.data;
                } else if (msg.type === "manifest") {
                    // ignore manifest on the UI for now
                } else if (msg.type === "backends") {
                    buildLlmButtons(msg.backends);
                } else if (
                    msg.type === "user_msg" ||
                    msg.type === "ollama_response" ||
                    msg.type === "llm_output" ||
                    msg.type === "error" ||
                    msg.type === "warning"
                ) {
                    appendChat(msg);
                }
            }

            function buildLlmButtons(backends) {
                const container = document.getElementById("llm-buttons");
                if (!container) return;
                container.innerHTML = "";
                backends.forEach((b, i) => {
                    const btn = document.createElement("button");
                    btn.textContent = b.label;
                    btn.className = "llm-btn";
                    btn.dataset.id = b.id;
                    btn.onclick = () => selectLlm(b.id);
                    container.appendChild(btn);
                    // Auto-select the first backend
                    if (i === 0) selectLlm(b.id);
                });
            }

            function selectLlm(id) {
                selectedLlm = id;
                document.querySelectorAll(".llm-btn").forEach((el) => {
                    el.classList.toggle("selected", el.dataset.id === id);
                });
            }

            function sendChat() {
                const input = document.getElementById("chat-input");
                if (!input || !input.value.trim() || !ws) return;
                ws.send(
                    JSON.stringify({
                        type: "chat",
                        msg: input.value,
                        llm: selectedLlm,
                    }),
                );
                input.value = "";
            }

            function appendChat(msg) {
                console.log("[Chat] Appending message:", msg);
                const div = document.getElementById("chat-messages");
                if (!div) return;

                // Determine sender label
                let sender;
                let isError = false;
                if (msg.type === "user_msg") {
                    sender = msg.from || "You";
                } else if (msg.type === "error") {
                    sender = "❌ Error";
                    isError = true;
                } else if (msg.type === "warning") {
                    sender = "⚠️ Warning";
                } else {
                    // Use the actual from (e.g. "server", "desktop", "gemini") when available
                    sender = msg.from || "Helix";
                }

                // === VERY ROBUST TEXT EXTRACTION ===
                // This prevents "[object Object]" no matter what shape the server sends.
                function extractText(v) {
                    if (v == null) return "";
                    if (typeof v === "string") return v;
                    if (typeof v === "number" || typeof v === "boolean") return String(v);
                    if (Array.isArray(v)) {
                        return v.map(extractText).filter(Boolean).join(" ");
                    }
                    if (typeof v === "object") {
                        // Try the most common places first
                        const keys = ["msg", "data", "text", "content", "response", "answer", "result", "output"];
                        for (const k of keys) {
                            if (v[k] != null) {
                                const t = extractText(v[k]);
                                if (t) return t;
                            }
                        }
                        // Try any string property that looks like a sentence
                        for (const k in v) {
                            const t = extractText(v[k]);
                            if (t && t.length > 3) return t;
                        }
                        return JSON.stringify(v);
                    }
                    return String(v);
                }

                let text = extractText(msg.data ?? msg.msg ?? msg.text ?? msg);

                if (!text || text.trim() === "") return;

                // If what we got is a JSON string, try to unwrap it one level
                if (typeof text === "string" && text.trim().startsWith("{")) {
                    try {
                        const parsed = JSON.parse(text);
                        const unwrapped = extractText(parsed);
                        if (unwrapped && unwrapped !== text) text = unwrapped;
                    } catch (e) {}
                }

                // Absolute final guard — NEVER let an object reach the DOM as [object Object]
                if (typeof text !== "string") {
                    try { text = JSON.stringify(text); } catch(e) { text = String(text); }
                }
                if (!text || text === "[object Object]" || text === "{}" || text.trim() === "") {
                    text = "(no readable text received from server)";
                }

                const p = document.createElement("div");
                p.className = "message" + (isError ? " error-msg" : "");
                // Use textContent on a span to guarantee we never get [object Object]
                const senderSpan = document.createElement("span");
                senderSpan.className = "sender";
                senderSpan.textContent = sender + ": ";
                const textSpan = document.createElement("span");
                textSpan.textContent = text;
                p.appendChild(senderSpan);
                p.appendChild(textSpan);
                if (isError) {
                    p.style.color = "#ff6b6b";
                    p.style.fontWeight = "500";
                }
                div.appendChild(p);
                div.scrollTop = div.scrollHeight;
            }

            function saveConfig() {
                const val = document.getElementById("config-textarea").value;
                if (ws)
                    ws.send(JSON.stringify({ type: "config_save", data: val }));
            }

            window.onload = () => {
                connectWS();
            };
        </script>
    </body>
</html>
