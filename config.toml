# --- OLLAMA MODEL PRELOAD AND KEEP-ALIVE (Task #89) ---
# These settings keep the Ollama model loaded in GPU/CPU memory at all times.
# They can also be set via .env to avoid recompiling.
#
# OLLAMA_PRELOAD=true
#   Send a dummy request at Helix startup to pre-warm the model.
#   Eliminates the cold-start delay on the first real user query.
#   Set to "false" to skip (e.g. during development to speed up restarts).
#
# OLLAMA_KEEP_ALIVE_SECS=240
#   How often (in seconds) the keepalive heartbeat fires.
#   Default: 240 s (4 minutes), just below Ollama's default 5-minute
#   eviction timeout.  Set to 0 to disable.
#
# OLLAMA_URL / OLLAMA_MODEL
#   Override the Ollama backend URL and model for the keepalive task.
#   Falls back to the first [[ollama]] entry in this file when absent.

[ollama_keepalive]
preload       = true
interval_secs = 240

# --- REASONING ENGINE CONFIG ---
[reasoning]
enabled = true
default_goal = "Improve agent reliability, safety, and self-correction"
cycle_interval_ticks = 20
metrics_interval_ticks = 40
health_check_interval_ticks = 100

# ─────────────────────────────────────────────────────────────────────────────
# Helix OKF (Open Knowledge Format) Librarian System
# Task #164 — protocol v1: PROTOCOL.md
# Helix IS its own OKF server: with enabled = true it serves the v1 endpoints
# (GET /okf/health, /okf/manifest.json, /okf/bundles/{id}/manifest.json,
#  /okf/knowledge/{kid}; POST /okf/traces, /okf/bundles/{b}/concepts)
# on the web server port, and can fetch from itself via server_url.
# ─────────────────────────────────────────────────────────────────────────────
[helix.okf]
enabled = false                 # Master switch (set to true to activate)
server_url = "http://localhost:8080"
auto_reload = true
index_file = "okf_index.json"
poll_interval_secs = 60
request_timeout_secs = 30
trace_file = "okf_traces.jsonl" # JSONL append target for POST /okf/traces
# auth_token = "optional-token-here"   # Uncomment if your OKF server requires auth

# ─────────────────────────────────────────────────────────────────────────────
# MCP (Model Context Protocol) client
# Lets Helix spawn external MCP servers as subprocesses over stdio and use
# their tools. NOTE: this is unrelated to src/mcp/ ("Master Control Program",
# the internal bus router).
#
# Everything below is commented out, which leaves the client disabled — the
# default. When disabled, no servers are spawned and no MCP tools appear.
# ─────────────────────────────────────────────────────────────────────────────
 [mcp]
 enabled = true                  # Master switch (set to true to activate)
#
[[mcp.servers]]
name = "google"                  # Tool namespace: mcp__google__<tool>
command = "/home/cobble/.local/bin/google-mcp"  # e.g. ~/workspace/google-mcp/target/debug/google-mcp
# args = []                        # Extra argv entries (optional)
#
# # Extra env vars for the server process, on top of the inherited environment.
# # google-mcp needs these for OAuth (see ~/workspace/google-mcp/README.md).
# [mcp.servers.env]
# GOOGLE_CLIENT_ID = ""
# GOOGLE_CLIENT_SECRET = ""
