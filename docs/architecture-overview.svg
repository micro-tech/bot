<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="780" viewBox="0 0 1100 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .node { font-family: system-ui, -apple-system, sans-serif; }
      .title { font-size: 18px; font-weight: 600; fill: #f8fafc; }
      .label { font-size: 13px; fill: #e2e8f0; }
      .subgraph { fill: #1e2937; stroke: #475569; stroke-width: 2; }
      .bus { fill: #f9f, stroke: #333; stroke-width: 4; }
      .cpu { fill: #bbf, stroke: #33f; stroke-width: 2; }
      .arrow { stroke: #64748b; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="780" fill="#0f172a"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" class="title" fill="#f1f5f9">Agent OS - High Level Architecture (Layer 0)</text>

  <!-- External -->
  <rect x="40" y="80" width="200" height="140" rx="12" class="subgraph"/>
  <text x="140" y="105" text-anchor="middle" fill="#94a3b8" font-size="12">EXTERNAL</text>
  <rect x="60" y="120" width="160" height="40" rx="8" fill="#334155"/>
  <text x="140" y="145" text-anchor="middle" class="label">👤 Users / Clients</text>
  <rect x="60" y="170" width="160" height="40" rx="8" fill="#334155"/>
  <text x="140" y="195" text-anchor="middle" class="label">🧠 Ollama / Gemini</text>

  <!-- Core System -->
  <rect x="280" y="80" width="240" height="140" rx="12" class="subgraph"/>
  <text x="400" y="105" text-anchor="middle" fill="#94a3b8" font-size="12">CORE SYSTEM</text>
  <rect x="300" y="120" width="200" height="80" rx="8" class="bus"/>
  <text x="400" y="155" text-anchor="middle" class="label">Central Bus</text>
  <text x="400" y="175" text-anchor="middle" fill="#64748b" font-size="11">pub-sub messaging</text>

  <!-- CPU -->
  <rect x="560" y="80" width="200" height="140" rx="12" class="subgraph"/>
  <text x="660" y="105" text-anchor="middle" fill="#94a3b8" font-size="12">CPU</text>
  <rect x="580" y="120" width="160" height="80" rx="8" class="cpu"/>
  <text x="660" y="165" text-anchor="middle" class="label">CPU Executor</text>

  <!-- Subsystems -->
  <rect x="40" y="260" width="720" height="120" rx="12" class="subgraph"/>
  <text x="400" y="285" text-anchor="middle" fill="#94a3b8" font-size="12">SUBSYSTEMS</text>
  
  <rect x="60" y="300" width="160" height="60" rx="8" fill="#334155"/>
  <text x="140" y="330" text-anchor="middle" class="label">Memory System</text>
  
  <rect x="240" y="300" width="160" height="60" rx="8" fill="#334155"/>
  <text x="320" y="330" text-anchor="middle" class="label">Skills &amp; Hooks</text>
  
  <rect x="420" y="300" width="160" height="60" rx="8" fill="#334155"/>
  <text x="500" y="330" text-anchor="middle" class="label">HyEvo Engine</text>
  
  <rect x="600" y="300" width="140" height="60" rx="8" fill="#334155"/>
  <text x="670" y="330" text-anchor="middle" class="label">Reasoning</text>

  <!-- Interfaces -->
  <rect x="40" y="420" width="340" height="120" rx="12" class="subgraph"/>
  <text x="210" y="445" text-anchor="middle" fill="#94a3b8" font-size="12">INTERFACES</text>
  <rect x="60" y="460" width="140" height="60" rx="8" fill="#334155"/>
  <text x="130" y="490" text-anchor="middle" class="label">Web Server</text>
  <rect x="220" y="460" width="140" height="60" rx="8" fill="#334155"/>
  <text x="290" y="490" text-anchor="middle" class="label">Terminal / UNIX</text>

  <!-- Services -->
  <rect x="420" y="420" width="340" height="120" rx="12" class="subgraph"/>
  <text x="590" y="445" text-anchor="middle" fill="#94a3b8" font-size="12">SERVICES</text>
  <rect x="440" y="460" width="90" height="60" rx="8" fill="#334155"/>
  <text x="485" y="490" text-anchor="middle" class="label">Heartbeat</text>
  <rect x="550" y="460" width="90" height="60" rx="8" fill="#334155"/>
  <text x="595" y="490" text-anchor="middle" class="label">Cron Jobs</text>
  <rect x="660" y="460" width="90" height="60" rx="8" fill="#334155"/>
  <text x="705" y="490" text-anchor="middle" class="label">A2A</text>

  <!-- Arrows -->
  <!-- User to Web -->
  <line x1="220" y1="140" x2="280" y2="140" class="arrow" marker-end="url(#arrowhead)"/>
  <!-- Web to Bus -->
  <line x1="340" y1="160" x2="380" y2="160" class="arrow"/>
  <!-- CLI to CPU -->
  <line x1="380" y1="200" x2="560" y2="200" class="arrow"/>
  <!-- Bus to CPU -->
  <line x1="480" y1="160" x2="560" y2="160" class="arrow"/>
  <!-- CPU to Memory -->
  <line x1="660" y1="220" x2="140" y2="300" class="arrow"/>
  <!-- CPU to Skills -->
  <line x1="660" y1="220" x2="320" y2="300" class="arrow"/>
  <!-- CPU to HyEvo -->
  <line x1="660" y1="220" x2="500" y2="300" class="arrow"/>
  <!-- CPU to Reasoning -->
  <line x1="660" y1="220" x2="670" y2="300" class="arrow"/>
  <!-- CPU to LLM -->
  <line x1="660" y1="140" x2="220" y2="190" class="arrow"/>
  <!-- Bus to Services -->
  <line x1="480" y1="200" x2="590" y2="420" class="arrow"/>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="40" y="580" width="1020" height="160" rx="12" fill="#1e2937" stroke="#475569"/>
  <text x="80" y="610" fill="#f1f5f9" font-size="14" font-weight="600">Key Files</text>
  
  <text x="80" y="640" fill="#94a3b8" font-size="12">• Entry Point: src/main.rs</text>
  <text x="80" y="660" fill="#94a3b8" font-size="12">• Central Bus: src/bus/mod.rs</text>
  <text x="80" y="680" fill="#94a3b8" font-size="12">• CPU: src/cpu/cpu.rs + executor.rs</text>
  <text x="80" y="700" fill="#94a3b8" font-size="12">• Memory: src/memory/manager.rs</text>
  <text x="80" y="720" fill="#94a3b8" font-size="12">• HyEvo: src/hy_evo/</text>

  <text x="450" y="640" fill="#94a3b8" font-size="12">• Web: src/io/web_server/</text>
  <text x="450" y="660" fill="#94a3b8" font-size="12">• LLM: src/io/ollama/ + src/llm/</text>
  <text x="450" y="680" fill="#94a3b8" font-size="12">• Skills: src/skills/</text>
  <text x="450" y="700" fill="#94a3b8" font-size="12">• Hooks: src/hooks/</text>
  <text x="450" y="720" fill="#94a3b8" font-size="12">• Services: src/cron/, src/a2a/, src/mcp/</text>

</svg>