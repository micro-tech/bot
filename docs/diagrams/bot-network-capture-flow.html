<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helix · Network capture log</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.75rem;
    }

    .back {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      margin-bottom: 1.5rem;
    }
    .back a { color: var(--color-muted); text-decoration: none; border-bottom: 1px solid rgba(79,93,117,0.35); }
    .back a:hover { color: var(--color-ink); }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · Diagram Design</p>
    <h1>Helix — network capture log</h1>
    <p class="back"><a href="bot-architecture.html">← Helix architecture overview</a></p>

    <div class="diagram-container">
      <svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bot-network-capture-flow-title bot-network-capture-flow-desc">
        <title id="bot-network-capture-flow-title">Helix — network capture log</title>
        <desc id="bot-network-capture-flow-desc">Data-flow detail of the Helix hourly network capture log (task 376): a seeded hourly cron routine runs an in-process CPU handler that asks mcp_wire for the interfaces, picks the primary LAN interface, captures 50 packets over 10 seconds, reduces the capture to one summary line of packet counts, and appends it to logs/network_capture.log, a 48-line archive the nightly network report reads back through read_log instead of relying on a single live capture.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first (behind boxes) -->

        <!-- TICK: Cron routine -> Helix core -->
        <line x1="220" y1="92" x2="300" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- PICK: Helix core -> mcp_wire interfaces -->
        <line x1="540" y1="92" x2="660" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- CAPTURE: mcp_wire interfaces -> mcp_wire capture -->
        <line x1="790" y1="124" x2="790" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- REDUCE: mcp_wire capture -> Summarize -->
        <line x1="660" y1="232" x2="540" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- APPEND: Summarize -> network_capture.log -->
        <line x1="300" y1="232" x2="220" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- READ: network_capture.log -> Nightly report -->
        <path d="M 130,264 V 300 H 420 V 340"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="240" y="82" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="260" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TICK</text>

        <rect x="580" y="82" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="600" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PICK</text>

        <rect x="800" y="152" width="56" height="14" rx="2" fill="#f5f5f5"/>
        <text x="828" y="162" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CAPTURE</text>

        <rect x="574" y="222" width="52" height="14" rx="2" fill="#f5f5f5"/>
        <text x="600" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REDUCE</text>

        <rect x="240" y="222" width="48" height="14" rx="2" fill="#f5f5f5"/>
        <text x="264" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPEND</text>

        <rect x="250" y="290" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="270" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>

        <!-- Node: Cron routine -->
        <rect x="40" y="60" width="180" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="60" width="180" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="68" width="32" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="64" y="77" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRON</text>
        <text x="130" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cron routine</text>
        <text x="130" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">network-capture-log · 1h</text>

        <!-- Node: Helix core (focal) -->
        <rect x="300" y="60" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="60" width="240" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="308" y="68" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="324" y="77" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="420" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Helix core</text>
        <text x="420" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">routine handler · no LLM</text>

        <!-- Node: mcp_wire interfaces -->
        <rect x="660" y="60" width="260" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="660" y="60" width="260" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="668" y="68" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="682" y="77" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
        <text x="790" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mcp_wire interfaces</text>
        <text x="790" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pick primary LAN interface</text>

        <!-- Node: mcp_wire capture -->
        <rect x="660" y="200" width="260" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="660" y="200" width="260" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="668" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="682" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
        <text x="790" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mcp_wire capture</text>
        <text x="790" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">50 pkts · 10 s · blocking thread</text>

        <!-- Node: Summarize -->
        <rect x="300" y="200" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="200" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="308" y="208" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="324" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
        <text x="420" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Summarize</text>
        <text x="420" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pkts · retr · rst · dupack · ooo</text>

        <!-- Node: network_capture.log (store) -->
        <rect x="40" y="200" width="180" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="200" width="180" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="48" y="208" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="64" y="217" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="130" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">network_capture.log</text>
        <text x="130" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one line / hour · 48 cap</text>

        <!-- Node: Nightly report -->
        <rect x="300" y="340" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="340" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="308" y="348" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="332" y="357" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPORT</text>
        <text x="420" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nightly report</text>
        <text x="420" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">read_log · last 24 h of lines</text>

        <!-- Callouts -->
        <text x="480" y="460" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">Fail-soft — a missed capture logs a warning and appends nothing; the archive holds only real samples.</text>
        <text x="480" y="484" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">Only what a live capture can observe is recorded — true interface error/drop counters are not available from the wire tools.</text>

        <!-- Legend strip -->
        <line x1="40" y1="560" x2="920" y2="560" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="588" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal</text>

        <rect x="120" y="588" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="140" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input</text>

        <rect x="210" y="588" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="230" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Backend</text>

        <rect x="310" y="588" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="330" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

        <line x1="420" y1="593" x2="448" y2="593" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="456" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flow</text>
      </svg>
    </div>
  </div>
</body>
</html>
