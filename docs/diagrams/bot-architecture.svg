<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bot-architecture-title bot-architecture-desc" id="bot-architecture-root">
        <title id="bot-architecture-title">Helix — architecture and data flow</title>
        <desc id="bot-architecture-desc">Architecture and data-flow overview of the Helix agent: web UI, agent core with the commander pattern and sub-agents, LLM backends, MCP tools, the support watcher, the in-Helix OKF server, auth-gated ops endpoints, and chat history.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #bot-architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #bot-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #bot-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #bot-architecture-root .diagram-container { overflow-x: visible; }</style>
          <marker id="bot-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="bot-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="bot-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first (behind boxes) -->

        <!-- CHAT: Web UI -> Helix core -->
        <line x1="190" y1="92" x2="300" y2="92" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#bot-architecture-arrow-link)"/>

        <!-- PROMPT: Helix core -> LLM backends (headline path) -->
        <line x1="540" y1="92" x2="660" y2="92" stroke="#bf4520" stroke-width="1.4" marker-end="url(#bot-architecture-arrow-accent)"/>

        <!-- GEN: LLM backends -> Helix core (return) -->
        <line x1="660" y1="108" x2="540" y2="108" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#bot-architecture-arrow)"/>

        <!-- TOOLS: Helix core -> MCP tools -->
        <path d="M 540,122 H 752 Q 760,122 760,130 V 170"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-architecture-arrow)"/>

        <!-- DRAFTS: Support watcher -> Web UI -->
        <line x1="115" y1="124" x2="115" y2="220" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#bot-architecture-arrow)"/>

        <!-- MAIL: Support watcher -> MCP tools (mail fetch) -->
        <path d="M 190,252 H 644 Q 652,252 652,244 V 210 Q 652,202 660,202"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-architecture-arrow)"/>

        <!-- READ: Helix core -> OKF server (hops over MAIL) -->
        <path d="M 300,108 H 250 Q 242,108 242,116 V 244 a 8,8 0 0,0 0,16 V 384 Q 242,392 250,392 H 190"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-architecture-arrow)"/>

        <!-- OPS: Web UI -> /ops endpoints (hops over READ and MAIL) -->
        <path d="M 190,150 H 234 a 8,8 0 0,1 16,0 H 612 Q 620,150 620,158 V 244 a 8,8 0 0,0 0,16 V 344 Q 620,352 628,352 H 660"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#bot-architecture-arrow)"/>

        <!-- RECALL: Helix core -> chat history (hops over MAIL) -->
        <path d="M 420,134 V 244 a 8,8 0 0,0 0,16 V 300"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#bot-architecture-arrow)"/>

