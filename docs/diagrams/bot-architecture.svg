        <line x1="190" y1="82" x2="300" y2="82" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#bot-architecture-arrow-link)"/>

        <!-- PROMPT: Helix core -> LLM backends (headline path) -->
        <line x1="540" y1="82" x2="660" y2="82" stroke="#bf4520" stroke-width="1.4" marker-end="url(#bot-architecture-arrow-accent)"/>

        <!-- GEN: LLM backends -> Helix core (return) -->
        <line x1="660" y1="98" x2="540" y2="98" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#bot-architecture-arrow)"/>

        <!-- TOOLS: Helix core -> MCP tools -->
        <path d="M 540,110 H 644 Q 652,110 652,118 V 194 Q 652,202 660,202"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-architecture-arrow)"/>

        <!-- DRAFTS: Support watcher -> Web UI -->
        <line x1="115" y1="200" x2="115" y2="114" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#bot-architecture-arrow)"/>

