<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 704" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bot-support-watcher-flow-title bot-support-watcher-flow-desc" id="bot-support-watcher-flow-root">
        <title id="bot-support-watcher-flow-title">Helix — support watcher flow</title>
        <desc id="bot-support-watcher-flow-desc">Flowchart of the Helix support-desk loop: a cadence tick pulls mail, new mail gets a Gemini-pinned draft reply, drafts wait for John's approval unless auto-send is enabled, and failed sends stay Approved for manual retry.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #bot-support-watcher-flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #bot-support-watcher-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #bot-support-watcher-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #bot-support-watcher-flow-root .back { font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      margin-bottom: 1.5rem; }
      #bot-support-watcher-flow-root .back a { color: var(--color-muted); text-decoration: none; border-bottom: 1px solid rgba(79,93,117,0.35); }
      #bot-support-watcher-flow-root .back a:hover { color: var(--color-ink); }
      #bot-support-watcher-flow-root .diagram-container { overflow-x: visible; }</style>
          <marker id="bot-support-watcher-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first (behind boxes) -->
        <line x1="480" y1="76" x2="480" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-support-watcher-flow-arrow)"/>
        <line x1="480" y1="152" x2="480" y2="166" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-support-watcher-flow-arrow)"/>

        <!-- NO: no new mail -> Done -->
        <path d="M 395,208 H 192 Q 184,208 184,216 V 612 Q 184,620 192,620 H 390"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-support-watcher-flow-arrow)"/>

        <line x1="480" y1="250" x2="480" y2="270" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-support-watcher-flow-arrow)"/>
        <line x1="480" y1="326" x2="480" y2="366" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-support-watcher-flow-arrow)"/>
        <line x1="480" y1="422" x2="480" y2="446" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-support-watcher-flow-arrow)"/>

        <!-- AUTO / APPROVE -> Send -->
        <line x1="580" y1="492" x2="680" y2="492" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-support-watcher-flow-arrow)"/>

        <!-- DISCARD -> Done -->
        <line x1="480" y1="538" x2="480" y2="600" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-support-watcher-flow-arrow)"/>

        <!-- Send -> Sent -->
        <line x1="780" y1="520" x2="780" y2="552" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-support-watcher-flow-arrow)"/>

        <!-- FAILED: send failed -> back to review (stays Approved, manual retry) -->
        <path d="M 680,476 H 588 Q 580,476 580,468 V 414"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#bot-support-watcher-flow-arrow)"/>

        <!-- Arrow labels -->
        <rect x="192" y="400" width="32" height="14" rx="2" fill="#f5f5f5"/>
        <text x="208" y="410" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

        <rect x="492" y="246" width="36" height="14" rx="2" fill="#f5f5f5"/>
        <text x="510" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

        <rect x="592" y="484" width="88" height="14" rx="2" fill="#f5f5f5"/>
        <text x="636" y="494" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUTO / APPROVE</text>

        <rect x="488" y="562" width="64" height="14" rx="2" fill="#f5f5f5"/>
        <text x="520" y="572" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISCARD</text>

        <rect x="588" y="438" width="52" height="14" rx="2" fill="#f5f5f5"/>
        <text x="614" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAILED</text>

        <!-- Start oval -->
        <rect x="390" y="36" width="180" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="390" y="36" width="180" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="61" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cadence tick</text>

        <!-- Pull mail -->
        <rect x="380" y="96" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="96" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pull mail</text>
        <text x="480" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">support@ · mail tools</text>

        <!-- New mail? diamond -->
        <polygon points="480,166 565,208 480,250 395,208" fill="#f5f5f5"/>
        <polygon points="480,166 565,208 480,250 395,208" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="212" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">New mail?</text>

        <!-- Draft reply -->
        <rect x="380" y="270" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="270" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Draft reply</text>
        <text x="480" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Gemini-pinned agent</text>

        <!-- Await review -->
        <rect x="380" y="366" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="366" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="390" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Await John's review</text>
        <text x="480" y="406" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">approve · send · discard</text>

        <!-- Send? diamond (key decision, coral) -->
        <polygon points="480,446 580,492 480,538 380,492" fill="#f5f5f5"/>
        <polygon points="480,446 580,492 480,538 380,492" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="480" y="496" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Send?</text>

        <!-- Send -->
        <rect x="680" y="464" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="464" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="780" y="488" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Send</text>
        <text x="780" y="504" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mail tools · web token</text>

        <!-- Sent oval -->
        <rect x="690" y="552" width="180" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="690" y="552" width="180" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="780" y="577" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sent</text>

        <!-- Done oval -->
        <rect x="390" y="600" width="180" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="390" y="600" width="180" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="625" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Done</text>

        <!-- Legend strip -->
        <line x1="40" y1="664" x2="920" y2="664" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="680" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="690" width="28" height="14" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="74" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>

        <rect x="180" y="690" width="28" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="214" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

        <polygon points="300,697 314,690 328,697 314,704" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="336" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

        <polygon points="450,697 464,690 478,697 464,704" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="486" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Key decision</text>

        <line x1="620" y1="697" x2="660" y2="697" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#bot-support-watcher-flow-arrow)"/>
        <text x="668" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Retry / return</text>
      </svg>
