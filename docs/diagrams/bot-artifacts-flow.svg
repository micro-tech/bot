<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bot-artifacts-flow-title bot-artifacts-flow-desc" id="bot-artifacts-flow-root">
        <title id="bot-artifacts-flow-title">Helix — artifact tools flow</title>
        <desc id="bot-artifacts-flow-desc">Data-flow detail of the Helix artifact tools: the user asks for a chart, map, or file; Helix core dispatches create_artifact, create_network_map, or create_full_network_map; each writes a file under artifacts/; the saved line is parsed and published as a bus artifact message bridged to /ws, where the UI renders an inline card; the browser can also download the file directly at /artifacts/{name}.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #bot-artifacts-flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #bot-artifacts-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #bot-artifacts-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #bot-artifacts-flow-root .back { font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      margin-bottom: 1.5rem; }
      #bot-artifacts-flow-root .back a { color: var(--color-muted); text-decoration: none; border-bottom: 1px solid rgba(79,93,117,0.35); }
      #bot-artifacts-flow-root .back a:hover { color: var(--color-ink); }
      #bot-artifacts-flow-root .diagram-container { overflow-x: visible; }</style>
          <marker id="bot-artifacts-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="bot-artifacts-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="bot-artifacts-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first (behind boxes) -->

        <!-- ASK: Web UI -> Helix core -->
        <line x1="220" y1="92" x2="300" y2="92" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#bot-artifacts-flow-arrow-link)"/>

        <!-- CALL: Helix core -> create_artifact -->
        <path d="M 365,124 V 162 H 180 V 200"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-artifacts-flow-arrow)"/>
        <!-- CALL: Helix core -> create_network_map -->
        <path d="M 430,124 V 162 H 480 V 200"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-artifacts-flow-arrow)"/>
        <!-- CALL: Helix core -> create_full_network_map -->
        <path d="M 495,124 V 162 H 780 V 200"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-artifacts-flow-arrow)"/>

        <!-- SAVE: create_artifact -> artifacts/ -->
        <path d="M 180,272 V 300 H 410 V 340"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-artifacts-flow-arrow)"/>
        <!-- SAVE: create_network_map -> artifacts/ -->
        <line x1="480" y1="272" x2="480" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-artifacts-flow-arrow)"/>
        <!-- SAVE: create_full_network_map -> artifacts/ -->
        <path d="M 780,272 V 300 H 550 V 340"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-artifacts-flow-arrow)"/>

        <!-- PUBLISH: artifacts/ -> Publish to chat -->
        <line x1="620" y1="372" x2="640" y2="372" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-artifacts-flow-arrow)"/>

        <!-- CARD: Publish to chat -> Web UI (around the right edge, over the top) -->
        <path d="M 920,372 H 940 V 40 H 130 V 60"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#bot-artifacts-flow-arrow-link)"/>

        <!-- GET FILE: Web UI -> artifacts/ (around the left edge, under the bottom) -->
        <path d="M 40,92 H 20 V 460 H 480 V 404"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-artifacts-flow-arrow)"/>

        <!-- Arrow labels -->
        <rect x="240" y="82" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="260" y="92" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ASK</text>

        <rect x="486" y="172" width="36" height="14" rx="2" fill="#f5f5f5"/>
        <text x="504" y="182" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CALL</text>

        <rect x="486" y="296" width="36" height="14" rx="2" fill="#f5f5f5"/>
        <text x="504" y="306" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAVE</text>

        <rect x="500" y="32" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="520" y="42" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CARD</text>

        <rect x="220" y="452" width="56" height="14" rx="2" fill="#f5f5f5"/>
        <text x="248" y="462" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET FILE</text>

        <!-- Node: Web UI (input) -->
        <rect x="40" y="60" width="180" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="60" width="180" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="48" y="68" width="32" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="64" y="77" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
        <text x="130" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web UI</text>
        <text x="130" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chat · artifact cards</text>

        <!-- Node: Helix core (focal) -->
        <rect x="300" y="60" width="260" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="60" width="260" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="308" y="68" width="32" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="324" y="77" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="430" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Helix core</text>
        <text x="430" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">commander · tool dispatch</text>

        <!-- Node: create_artifact -->
        <rect x="40" y="200" width="280" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="200" width="280" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="48" y="208" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="64" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
        <text x="180" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">create_artifact</text>
        <text x="180" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kind · title · content</text>
        <text x="180" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">≤ 512 KB → write file</text>

        <!-- Node: create_network_map -->
        <rect x="340" y="200" width="280" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="340" y="200" width="280" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="348" y="208" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="364" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
        <text x="480" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">create_network_map</text>
        <text x="480" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">wire interfaces (mcp_wire)</text>
        <text x="480" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">parse 1st JSON doc → render SVG</text>

        <!-- Node: create_full_network_map -->
        <rect x="640" y="200" width="280" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="640" y="200" width="280" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="648" y="208" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="664" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
        <text x="780" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">create_full_network_map</text>
        <text x="780" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gateway · ARP · ping sweep /24</text>
        <text x="780" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hostnames → render SVG · ~20 s</text>

        <!-- Node: artifacts/ on disk (store) -->
        <rect x="340" y="340" width="280" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="340" y="340" width="280" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="348" y="348" width="32" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="364" y="357" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="480" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">artifacts/ on disk</text>
        <text x="480" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GET /artifacts/{name} · public</text>

        <!-- Node: Publish to chat -->
        <rect x="640" y="340" width="280" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="640" y="340" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="648" y="348" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="672" y="357" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PUBLISH</text>
        <text x="780" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Publish to chat</text>
        <text x="780" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">artifact msg → bus → /ws → card</text>

        <!-- Guards note -->
        <text x="480" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Guards: content ≤ 512 KB · path canonicalized under artifacts/ · symlink &amp; traversal rejected</text>

        <!-- Legend strip -->
        <line x1="40" y1="560" x2="920" y2="560" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="588" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="60" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal</text>

        <rect x="120" y="588" width="14" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="140" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input</text>

        <rect x="210" y="588" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="230" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Backend</text>

        <rect x="310" y="588" width="14" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="330" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

        <line x1="420" y1="593" x2="448" y2="593" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#bot-artifacts-flow-arrow-link)"/>
        <text x="456" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP / WS</text>

        <line x1="560" y1="593" x2="588" y2="593" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-artifacts-flow-arrow)"/>
        <text x="596" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP</text>
      </svg>
