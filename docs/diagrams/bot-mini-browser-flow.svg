<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bot-mini-browser-flow-title bot-mini-browser-flow-desc" id="bot-mini-browser-flow-root">
        <title id="bot-mini-browser-flow-title">Helix — mini-browser</title>
        <desc id="bot-mini-browser-flow-desc">Data-flow detail of the Helix mini-browser (src/io/browser, tasks 350-357 + 360): the LLM browser tool or the token-gated /browser/* routes call the bridge, which reaches one shared headless Firefox session on a dedicated tokio runtime; the session manager drives Firefox over WebDriver BiDi via geckodriver; navigation is confined to allowed_hosts and screenshots, text, and OAuth status flow back; disabled by default, no Firefox spawns until [browser] enabled = true.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #bot-mini-browser-flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #bot-mini-browser-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #bot-mini-browser-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #bot-mini-browser-flow-root .back { font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      margin-bottom: 1.5rem; }
      #bot-mini-browser-flow-root .back a { color: var(--color-muted); text-decoration: none; border-bottom: 1px solid rgba(79,93,117,0.35); }
      #bot-mini-browser-flow-root .back a:hover { color: var(--color-ink); }
      #bot-mini-browser-flow-root a { cursor: pointer; }
      #bot-mini-browser-flow-root .diagram-container { overflow-x: visible; }</style>
          <marker id="bot-mini-browser-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="bot-mini-browser-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="bot-mini-browser-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first (behind boxes) -->

        <!-- CALL: Callers -> Bridge -->
        <line x1="210" y1="72" x2="260" y2="72" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-mini-browser-flow-arrow)"/>
        <!-- ROUTE: Bridge -> BROWSER_RT -->
        <line x1="460" y1="72" x2="480" y2="72" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-mini-browser-flow-arrow)"/>
        <!-- LAZY: BROWSER_RT -> Session manager -->
        <line x1="680" y1="72" x2="700" y2="72" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-mini-browser-flow-arrow)"/>
        <!-- DRIVE: Session manager -> BiDi seam -->
        <line x1="800" y1="104" x2="800" y2="190" stroke="#bf4520" stroke-width="1.4" marker-end="url(#bot-mini-browser-flow-arrow-accent)"/>
        <!-- BIDI: BiDi seam -> geckodriver -->
        <line x1="700" y1="222" x2="680" y2="222" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#bot-mini-browser-flow-arrow-link)"/>
        <!-- LAUNCH: geckodriver -> Headless Firefox -->
        <line x1="480" y1="222" x2="460" y2="222" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bot-mini-browser-flow-arrow)"/>
        <!-- NAVIGATE: Headless Firefox -> Allowed page -->
        <line x1="260" y1="222" x2="240" y2="222" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#bot-mini-browser-flow-arrow-link)"/>
        <!-- RESULTS: Allowed page -> BiDi seam (return, under row 2) -->
        <path d="M 140,254 V 300 H 800 V 254"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#bot-mini-browser-flow-arrow)"/>

        <!-- Arrow labels -->
        <rect x="215" y="62" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="235" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CALL</text>

        <rect x="446" y="62" width="48" height="14" rx="2" fill="#f5f5f5"/>
        <text x="470" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE</text>

        <rect x="670" y="62" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="690" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LAZY</text>

        <rect x="808" y="140" width="48" height="14" rx="2" fill="#f5f5f5"/>
        <text x="832" y="150" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DRIVE</text>

        <rect x="668" y="212" width="44" height="14" rx="2" fill="#f5f5f5"/>
        <text x="690" y="222" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BIDI</text>

        <rect x="444" y="212" width="52" height="14" rx="2" fill="#f5f5f5"/>
        <text x="470" y="222" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LAUNCH</text>

        <rect x="218" y="212" width="64" height="14" rx="2" fill="#f5f5f5"/>
        <text x="250" y="222" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NAVIGATE</text>

        <rect x="442" y="290" width="56" height="14" rx="2" fill="#f5f5f5"/>
        <text x="470" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULTS</text>

        <!-- Node: Callers (input) -->
        <rect x="40" y="40" width="170" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="40" width="170" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="48" y="48" width="32" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="64" y="57" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
        <text x="125" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Callers</text>
        <text x="125" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">browser tool · /browser/*</text>

        <!-- Node: Bridge -->
        <rect x="260" y="40" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="260" y="40" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="268" y="48" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="288" y="57" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BRIDGE</text>
        <text x="360" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bridge</text>
        <text x="360" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sync callers · one runtime</text>

        <!-- Node: BROWSER_RT -->
        <rect x="480" y="40" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="40" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="488" y="48" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="512" y="57" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUNTIME</text>
        <text x="580" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BROWSER_RT</text>
        <text x="580" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dedicated tokio runtime</text>

        <!-- Node: Session manager -->
        <rect x="700" y="40" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="40" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="708" y="48" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="732" y="57" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SESSION</text>
        <text x="800" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Session manager</text>
        <text x="800" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one session · lazy start</text>

        <!-- Node: BiDi seam -->
        <rect x="700" y="190" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="190" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="708" y="198" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="724" y="207" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BIDI</text>
        <text x="800" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BiDi seam</text>
        <text x="800" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">thirtyfour · BiDi types</text>

        <!-- Node: geckodriver -->
        <rect x="480" y="190" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="190" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="488" y="198" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="508" y="207" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DRIVER</text>
        <text x="580" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">geckodriver</text>
        <text x="580" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">child process · WebSocket</text>

        <!-- Node: Headless Firefox (focal) -->
        <rect x="260" y="190" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="260" y="190" width="200" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="268" y="198" width="48" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="292" y="207" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BROWSER</text>
        <text x="360" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Headless Firefox</text>
        <text x="360" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">synced profile or fresh</text>

        <!-- Node: Allowed page -->
        <rect x="40" y="190" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="190" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="48" y="198" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="64" y="207" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PAGE</text>
        <text x="140" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Allowed page</text>
        <text x="140" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Google · localhost · list</text>

        <!-- Callouts -->
        <text x="480" y="340" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">Fail-closed: [browser] enabled = false by default — no Firefox spawns; navigation confined to allowed_hosts (Google + localhost).</text>
        <text x="480" y="364" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">First use case: Gmail OAuth on the R630 (loopback lands at google-mcp); password field contents are never returned.</text>

        <!-- Legend strip -->
        <line x1="40" y1="408" x2="920" y2="408" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="436" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="60" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal</text>

        <rect x="130" y="436" width="14" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="150" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input</text>

        <rect x="220" y="436" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Backend</text>

        <line x1="360" y1="441" x2="388" y2="441" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#bot-mini-browser-flow-arrow-link)"/>
        <text x="396" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP / WS</text>

        <line x1="520" y1="441" x2="548" y2="441" stroke="#bf4520" stroke-width="1.4" marker-end="url(#bot-mini-browser-flow-arrow-accent)"/>
        <text x="556" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary flow</text>

        <line x1="680" y1="441" x2="708" y2="441" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#bot-mini-browser-flow-arrow)"/>
        <text x="716" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>
      </svg>
