<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helix · Web server routes</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.75rem;
    }

    .back {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      margin-bottom: 1.5rem;
    }
    .back a { color: var(--color-muted); text-decoration: none; border-bottom: 1px solid rgba(79,93,117,0.35); }
    .back a:hover { color: var(--color-ink); }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Helix — web server routes</h1>
    <p class="back"><a href="bot-architecture.html">← Helix architecture overview</a></p>

    <div class="diagram-container">
      <svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bot-web-routes-flow-title bot-web-routes-flow-desc">
        <title id="bot-web-routes-flow-title">Helix — web server routes</title>
        <desc id="bot-web-routes-flow-desc">Architecture detail of the Helix axum web server routes, grouped by area: the browser reaches /ws chat, /support draft review, /okf knowledge and /a2a agent endpoints publicly, while /ops management, the /api/voice endpoints, and the new /self_improve/status snapshot sit behind the auth-gated router.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (before arrows and nodes) -->
        <rect x="270" y="40" width="420" height="280" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="274" y="44" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="300" y="53" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PUBLIC</text>

        <rect x="270" y="352" width="420" height="280" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="274" y="356" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="312" y="365" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AUTH-GATED</text>

        <!-- Arrows first (behind boxes) -->
        <!-- Browser -> /ws chat -->
        <path d="M 210,212 H 392 Q 400,212 400,204 V 140"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Browser -> /support/* -->
        <path d="M 210,228 H 416 Q 424,228 424,220 V 164"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Browser -> /okf/* + /a2a -->
        <path d="M 210,252 H 300"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Browser -> /ops/* -->
        <path d="M 100,264 V 416 Q 100,424 108,424 H 300"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Browser -> /api/voice/* -->
        <path d="M 140,264 V 496 Q 140,504 148,504 H 300"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Browser -> /self_improve/status (hops over the /ops and /api/voice horizontals) -->
        <path d="M 180,264 V 416 M 180,432 V 496 M 180,512 V 576 Q 180,584 188,584 H 300"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="384" y="142" width="32" height="14" rx="2" fill="#f5f5f5"/>
        <text x="400" y="152" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WS</text>

        <rect x="148" y="372" width="52" height="14" rx="2" fill="#f5f5f5"/>
        <text x="174" y="382" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VOICE</text>

        <!-- Node: Browser (input) -->
        <rect x="40" y="200" width="170" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="200" width="170" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="208" width="32" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="64" y="217" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
        <text x="125" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>
        <text x="125" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">web UI · HTTP + /ws</text>

        <!-- Node: /ws chat -->
        <rect x="300" y="84" width="360" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="84" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="308" y="92" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="320" y="101" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WS</text>
        <text x="480" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/ws chat</text>
        <text x="480" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">websocket · chat stream</text>

        <!-- Node: /support/* -->
        <rect x="300" y="164" width="360" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="164" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="308" y="172" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="332" y="181" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SUPPORT</text>
        <text x="480" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/support/*</text>
        <text x="480" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">status · drafts · approve/send</text>

        <!-- Node: /okf/* + /a2a -->
        <rect x="300" y="244" width="360" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="244" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="308" y="252" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="338" y="261" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KNOWLEDGE</text>
        <text x="480" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/okf/* · /a2a</text>
        <text x="480" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">knowledge API · agent card</text>

        <!-- Node: /ops/* (auth-gated) -->
        <rect x="300" y="396" width="360" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="396" width="360" height="56" rx="6" fill="rgba(191,69,32,0.05)" stroke="rgba(191,69,32,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="308" y="404" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="322" y="413" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPS</text>
        <text x="480" y="430" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/ops/*</text>
        <text x="480" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">update · restart · usage</text>

        <!-- Node: /api/voice/* (auth-gated, new) -->
        <rect x="300" y="476" width="360" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="476" width="360" height="56" rx="6" fill="rgba(191,69,32,0.05)" stroke="rgba(191,69,32,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="308" y="484" width="36" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="326" y="493" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VOICE</text>
        <text x="480" y="510" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/api/voice/*</text>
        <text x="480" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">speak · transcribe · config</text>

        <!-- Node: /self_improve/status (auth-gated, new) -->
        <rect x="300" y="556" width="360" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="556" width="360" height="56" rx="6" fill="rgba(191,69,32,0.05)" stroke="rgba(191,69,32,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="308" y="564" width="44" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="330" y="573" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOOP</text>
        <text x="480" y="590" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/self_improve/status</text>
        <text x="480" y="604" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">self-improve loop snapshot</text>

        <!-- Legend strip -->
        <line x1="40" y1="664" x2="920" y2="664" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="680" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="692" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="60" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input</text>

        <rect x="130" y="692" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="150" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Route area</text>

        <rect x="250" y="692" width="14" height="10" rx="2" fill="rgba(191,69,32,0.05)" stroke="rgba(191,69,32,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="270" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Auth-gated</text>

        <line x1="400" y1="697" x2="428" y2="697" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="436" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP / WS</text>

        <line x1="560" y1="697" x2="588" y2="697" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="596" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP</text>
      </svg>
    </div>
  </div>
</body>
</html>
