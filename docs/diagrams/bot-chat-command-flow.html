<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helix · Chat-command loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.75rem;
    }

    .back {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      margin-bottom: 1.5rem;
    }
    .back a { color: var(--color-muted); text-decoration: none; border-bottom: 1px solid rgba(79,93,117,0.35); }
    .back a:hover { color: var(--color-ink); }

    svg { width: 100%; min-width: 960px; display: block; }
    svg a { cursor: pointer; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Helix — chat-command loop</h1>
    <p class="back"><a href="bot-architecture.html">← Helix architecture overview</a></p>

    <div class="diagram-container">
      <svg viewBox="0 0 960 730" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bot-chat-command-flow-title bot-chat-command-flow-desc">
        <title id="bot-chat-command-flow-title">Helix — chat-command loop</title>
        <desc id="bot-chat-command-flow-desc">Flowchart of the Helix chat-command loop (src/chat_command): a one-minute cron routine polls a chat-hub room via chat-mcp, gates on the sender, then either runs a plain allowlisted command locally or over SSH to the ASUS, or hands an LLM task to a backend as a detached job; replies with an exit-status line are posted back to the same room.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first (behind boxes) -->

        <!-- TICK: Tick -> Read room -->
        <line x1="480" y1="104" x2="480" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- READ: Read room -> Sender gate -->
        <line x1="480" y1="192" x2="480" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- NO: Sender gate -> Ignored -->
        <line x1="580" y1="254" x2="700" y2="254" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- YES: Sender gate -> Envelope -->
        <line x1="480" y1="292" x2="480" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- LLM: Envelope -> LLM task -->
        <line x1="590" y1="354" x2="700" y2="354" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- PLAIN: Envelope -> Command -->
        <line x1="480" y1="392" x2="480" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- DONE: Command -> Reply -->
        <line x1="480" y1="480" x2="480" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- REPORT: LLM task -> Reply (elbow, enters right edge) -->
        <path d="M 800,386 V 496 H 620 V 536 H 580"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="490" y="106" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="510" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TICK</text>

        <rect x="490" y="196" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="510" y="206" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>

        <rect x="621" y="244" width="28" height="14" rx="2" fill="#f5f5f5"/>
        <text x="635" y="254" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

        <rect x="490" y="296" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="510" y="306" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

        <rect x="626" y="344" width="38" height="14" rx="2" fill="#f5f5f5"/>
        <text x="645" y="354" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LLM</text>

        <rect x="488" y="396" width="44" height="14" rx="2" fill="#f5f5f5"/>
        <text x="510" y="406" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PLAIN</text>

        <rect x="490" y="484" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="510" y="494" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DONE</text>

        <rect x="690" y="486" width="52" height="14" rx="2" fill="#f5f5f5"/>
        <text x="716" y="496" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPORT</text>

        <!-- Node: Tick (start, oval) -->
        <rect x="380" y="40" width="200" height="64" rx="32" fill="#f5f5f5"/>
        <rect x="380" y="40" width="200" height="64" rx="32" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="480" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tick</text>
        <text x="480" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chat-command-watch · 1 min</text>

        <!-- Node: Read room -->
        <rect x="380" y="128" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="128" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="388" y="136" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="404" y="145" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
        <text x="480" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Read room</text>
        <text x="480" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chat-mcp read · cursor · seed</text>

        <!-- Node: Sender gate (decision, focal) -->
        <polygon points="480,216 580,254 480,292 380,254" fill="#f5f5f5"/>
        <polygon points="480,216 580,254 480,292 380,254" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="480" y="258" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sender allowed?</text>

        <!-- Node: Ignored (end, oval) -->
        <rect x="700" y="222" width="200" height="64" rx="32" fill="#f5f5f5"/>
        <rect x="700" y="222" width="200" height="64" rx="32" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="800" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ignored</text>
        <text x="800" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">audit-logged · no reply</text>

        <!-- Node: Structured envelope? (decision) -->
        <polygon points="480,316 590,354 480,392 370,354" fill="#f5f5f5"/>
        <polygon points="480,316 590,354 480,392 370,354" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="358" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Structured envelope?</text>

        <!-- Node: Command -->
        <rect x="380" y="416" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="416" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="388" y="424" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="402" y="433" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXEC</text>
        <text x="480" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Command</text>
        <text x="480" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">allowlist · no shell · asus: SSH</text>

        <!-- Node: LLM task -->
        <rect x="700" y="322" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="322" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="708" y="330" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="722" y="339" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
        <text x="800" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LLM task</text>
        <text x="800" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">which: server · desktop · gemini</text>

        <!-- Node: Reply to same room -->
        <rect x="380" y="504" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="504" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="388" y="512" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="402" y="521" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEND</text>
        <text x="480" y="540" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reply to same room</text>
        <text x="480" y="556" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chunked · [exit N] status line</text>

        <!-- Callouts -->
        <text x="480" y="612" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">Sender gate first — only cobble-jr and john; Helix's own replies never re-trigger. Ships disabled until John enables it.</text>
        <text x="480" y="636" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">LLM tasks run detached and never block the tick; the in-memory queue drains reports back to the room.</text>

        <!-- Legend strip -->
        <line x1="40" y1="676" x2="920" y2="676" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="692" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <ellipse cx="47" cy="709" rx="7" ry="5" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <text x="60" y="712" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>

        <rect x="158" y="704" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="178" y="712" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

        <polygon points="245,704 252,709 245,714 238,709" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <text x="258" y="712" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

        <polygon points="345,704 352,709 345,714 338,709" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="358" y="712" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sender gate</text>

        <line x1="480" y1="709" x2="508" y2="709" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="516" y="712" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flow</text>
      </svg>
    </div>
  </div>
</body>
</html>
