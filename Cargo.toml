[package]
name = "helix"
version = "1.0.1-pre"
edition = "2024"

[dependencies]
log = "0.4"
env_logger = "0.11.11"
#serenity = { git = "https://github.com/serenity-rs/serenity", branch = "current", features = ["full"] }


tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "net",
    "sync",
] }
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
hyper = { version = "1", features = ["http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-rustls = { version = "0.26", features = ["ring"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rcgen = "0.14.8"
tower = "0.5"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.3"
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
#reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls-manual-roots-no-provider"] }
tower-http = { version = "0.7.0", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
async-trait = "0.1"
rand = "0.10.2"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
# Use rustls-tls instead of native-tls to avoid pulling in openssl-sys on Windows
# (native-tls can trigger openssl builds in some configurations on certain setups).
lettre = { version = "0.11.6", features = ["smtp-transport", "rustls-tls"] }

# IMAP for email tools. We avoid "default" features if possible to reduce openssl pull.
# If imap still pulls openssl on your system, you may need to set OPENSSL_NO_VENDOR=1
# (see .cargo/config.toml below).
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }


native-tls = "0.2"
pulldown-cmark = "0.13.4"
similar = "3.1.1"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "json",
] }
sha2 = "0.11.0"

# === SSH / Remote Project Scanner support (Task 171) ===
# Optional because ssh2 -> libssh2-sys -> openssl-sys tends to trigger a full
# OpenSSL source build on Windows (requires Perl + build tools).
#
# To enable remote SSH scanning (Dell 630 -> Main PC):
#   cargo build --features ssh
#
# Then ensure OpenSSL is available:
#   - Windows: Install OpenSSL (e.g. from https://slproweb.com/products/Win32OpenSSL.html)
#              and set OPENSSL_DIR=C:\Program Files\OpenSSL-Win64
#   - Or use vcpkg: vcpkg install openssl:x64-windows
#   - Linux/macOS: usually works out of the box via pkg-config
#
# Do NOT use vendored-openssl unless you have Perl installed.
ssh2 = { version = "0.9", optional = true }

[features]
default = []
# Enable real SSH remote scanning (pulls ssh2 + libssh2-sys + openssl-sys)
ssh = ["dep:ssh2"]

[[bin]]
name = "installer"
path = "src/bin/installer.rs"
